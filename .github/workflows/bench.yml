name: Bench

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "placer seed"
        default: "42"
      budget:
        description: "per-board router budget in seconds"
        default: "60"
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: reference boards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: go build
        run: go build -o fragua ./cmd/fragua
      - name: run bench
        run: |
          ./fragua bench bench/boards \
            --seed "${{ github.event.inputs.seed || '42' }}" \
            --budget "${{ github.event.inputs.budget || '60' }}" \
            --json bench.json --md bench.md
      - name: summary
        if: always()
        run: cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: |
            bench.json
            bench.md
          if-no-files-found: warn
